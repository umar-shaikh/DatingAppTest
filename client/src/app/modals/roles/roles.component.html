<div class="modal-header">
    <h4 class="modal-tile pull-left">{{title}}</h4>
    <button type="button" class="btn-close pull-right" (click)="bsModalRef.hide()">
        <span class="visually-hidden">&times;</span>
    </button>
</div>

<div class="modal-body">
    @for(role of availableRoles; track $index){
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="role"  [checked]="selectedRoles.includes(role)"
                (change)="updateChecked(role)"
                value="role" [disabled]="role === 'Admin' && username === 'admin'"/>
            <label class="form-check-label" for="flexCheckDefault">
                {{role}}
            </label>
        </div>
    }
</div>
<div class="modal-footer">
    <button [disabled]="selectedRoles.length ===0" type="button" class="btn btn-success" (click)="onSelectRoles()">Submit</button>
</div>
